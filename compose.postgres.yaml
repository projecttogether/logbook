# PostgreSQL 18 next to Logbook, for a server without a PostgreSQL of its own.
# Set these values in .env; COMPOSE_FILE makes every `docker compose` command
# use both files:
#
#   COMPOSE_FILE=compose.yaml:compose.postgres.yaml
#   POSTGRES_PASSWORD=<password>    # openssl rand -hex 32
#   DATABASE_URL=postgres://logbook:<password>@postgres:5432/logbook
#
# The data lives in the volume postgres-data; back it up (docs/deployment.md).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-logbook}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
